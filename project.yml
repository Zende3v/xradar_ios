# XcodeGen spec — the single source of truth for EONA.xcodeproj.
# The .xcodeproj is generated (git-ignored): run `xcodegen generate` after
# pulling or after adding/removing files.
name: EONA

options:
  bundleIdPrefix: com.eona
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  developmentLanguage: fr
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  EonaKit:
    path: Packages/EonaKit
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

settingGroups:
  common:
    base:
      SWIFT_VERSION: "6.0"
      TARGETED_DEVICE_FAMILY: "1"

targets:
  EONA:
    type: application
    platform: iOS
    sources:
      - path: EONA
    dependencies:
      - package: EonaKit
        product: EonaCore
      - package: EonaKit
        product: EonaData
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      groups: [common]
      base:
        PRODUCT_NAME: EONA
        PRODUCT_BUNDLE_IDENTIFIER: com.eona.app
        INFOPLIST_FILE: EONA/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # Xcode 26 defaults: UI code is main-actor by default, background work opts out.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES

  EONATests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EONATests
    dependencies:
      - target: EONA
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eona.app.tests
        GENERATE_INFOPLIST_FILE: YES

  EONAUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EONAUITests
    dependencies:
      - target: EONA
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eona.app.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  EONA:
    build:
      targets:
        EONA: all
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - EONA
      targets:
        - EONATests
        - EONAUITests
        - package: EonaKit/EonaCoreTests
        - package: EonaKit/EonaDataTests
    archive:
      config: Release
